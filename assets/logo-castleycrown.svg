<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>
  <!-- Crown & Rook Chess Logo Mark -->
  <g transform="translate(10, 5)">
    <!-- Shield Background Glow -->
    <path d="M25,5 L41,18 L35,45 L25,50 L15,45 L9,18 Z" fill="none" stroke="url(#crownGold)" stroke-width="1.5" opacity="0.6"/>
    <!-- The Crown/Rook Emblem -->
    <path d="M15,40 L35,40 L33,35 L37,20 L31,23 L25,12 L19,23 L13,20 L17,35 Z" fill="url(#crownGold)" />
    <!-- Rook Battlements Cutouts -->
    <path d="M13,20 L17,20 M21,21.5 L29,21.5 M33,20 L37,20" stroke="#201A24" stroke-width="1.5" />
    <!-- Base Pedestal -->
    <path d="M11,41 L39,41 L37,45 L13,45 Z" fill="url(#crownGold)" />
    <!-- Crown Jewels Details (Little Circles) -->
    <circle cx="13" cy="19" r="1.5" fill="#FFF8E7" />
    <circle cx="25" cy="10" r="2" fill="#FFF8E7" />
    <circle cx="37" cy="19" r="1.5" fill="#FFF8E7" />
  </g>
  <!-- Wordmark Text -->
  <g transform="translate(70, 36)" fill="url(#crownGold)">
    <text font-family="'Times New Roman', Times, serif, Georgia" font-size="20" font-weight="bold" letter-spacing="3" y="0">CASTLEY</text>
    <text font-family="'Times New Roman', Times, serif, Georgia" font-size="20" font-weight="100" letter-spacing="3" x="110" y="0" fill="#FFF8E7">CROWN</text>
  </g>
</svg>
